<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="chat.css" rel="stylesheet" type="text/css">
    <link href="rain.css" rel="stylesheet" type="text/css">
    <title>WebSocket Chat</title>
</head>
<body>
<div id="rainContainer" class="rain-container"></div>
<div id="chat-container">
    <div id="chat-header">
        <h2>Demo Chat</h2>
        <div id="connection-counter">Active users: <span id="user-count">-</span></div>
    </div>
    <div id="chat-window">
        <!-- Messages will appear here -->
    </div>
    <div id="message-box">
        <input id="message-input" type="text" placeholder="Type a message" />
        <button id="send-button">Send</button>
    </div>
</div>
<!-- Note the type="module" attribute -->
<script type="module" src="chat.js"></script>
<script type="module" src="rain.js"></script>
</body>
</html>
